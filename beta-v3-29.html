      html.v327-app-loading { overflow: hidden; background: #fdf6f0; }
      html.v327-app-loading body { opacity: 0; pointer-events: none; }
      html.v327-app-loading::before { content: "Préparation de La Maison Winnie…"; position: fixed; z-index: 10000; inset: 0; display: grid; place-items: center; padding-top: 70px; background: radial-gradient(circle at 50% 38%, rgba(255,255,255,.96), transparent 25%), linear-gradient(180deg, #fffaf6, #f6e4d7); color: #6f4032; font: 700 15px/1.4 Jost, sans-serif; letter-spacing: .08em; text-align: center; text-transform: uppercase; }
      html.v327-app-loading::after { content: ""; position: fixed; z-index: 10001; top: calc(50% - 38px); left: calc(50% - 18px); width: 36px; height: 36px; border: 3px solid rgba(111,64,50,.16); border-top-color: #6f4032; border-radius: 50%; animation: lmw-final-spin .8s linear infinite; }
      html.v327-app-ready body { animation: lmw-final-reveal .24s ease both; }
      @keyframes lmw-final-spin { to { transform: rotate(360deg); } }
      @keyframes lmw-final-reveal { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { html.v327-app-loading::after, html.v327-app-ready body { animation: none; } }

        .v329-mobile-progress-count { margin-bottom: 20px; color: #4b2d24; font: 800 16px/1.2 Jost,sans-serif; }
        .v329-mobile-progress-labels { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: end; margin-bottom: 12px; color: #6f4032; text-align: center; }
        .v329-mobile-progress-labels span:first-child { visibility: hidden; }
        .v329-mobile-progress-labels b, .v329-mobile-progress-labels small { display: block; }
        .v329-mobile-progress-labels b { font: 800 12px/1.2 Jost,sans-serif; }
        .v329-mobile-progress-labels small { margin-top: 3px; font: 700 10px/1.2 Jost,sans-serif; }
        .v329-mobile-progress-track { position: relative; height: 12px; border-radius: 999px; background: #eadfd7; overflow: visible; }
        .v329-mobile-progress-track > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg,#ef8f76,#7e9b68); transition: width .2s ease; }
        .v329-mobile-progress-dot { position: absolute; top: 50%; width: 22px; height: 22px; border: 4px solid #fff; border-radius: 50%; background: #b59a8c; box-shadow: 0 0 0 2px rgba(111,64,50,.12); transform: translate(-50%,-50%); }
        .v329-mobile-progress-dot-four { left: 50%; }
        .v329-mobile-progress-dot-eight { left: 100%; }
        .v329-mobile-progress.is-four .v329-mobile-progress-dot-four,
        .v329-mobile-progress.is-eight .v329-mobile-progress-dot-eight { background: #7e9b68; }
      }

{{ body_fragment }}
    <script>
      (() => {
        const ENDPOINT = "https://lmw-checkout.vercel.app/api/create-checkout-beta";
        let busy = false;

        function resetDirectCheckout() {
          busy = false;
          document.querySelectorAll("#orderCta, .v325-review-button, [data-v325-direct-checkout]").forEach((node) => {
            node.disabled = false;
            node.textContent = "Passer au paiement sécurisé";
          });
          const feedback = document.getElementById("checkoutFeedback");
          if (feedback?.textContent === "Connexion à Stripe…") feedback.textContent = "";
        }

        async function directBetaCheckout(button) {
          if (busy) return;
          const items = (typeof products !== "undefined" && typeof st !== "undefined")
            ? products.map((product, index) => ({ id: product.id, quantity: Number(st.p?.[index]?.q || 0) })).filter((item) => item.quantity > 0)
            : [];
          const feedback = document.getElementById("checkoutFeedback");
          if (!items.length) {
            const message = "Ajoutez au moins un produit à votre box avant de passer au paiement.";
            if (feedback) feedback.textContent = message;
            alert(message);
            return;
          }

          busy = true;
          const originalText = button?.textContent || "Passer au paiement sécurisé";
          document.querySelectorAll("#orderCta, .v325-review-button, [data-v325-direct-checkout]").forEach((node) => {
            node.disabled = true;
            node.textContent = "Redirection sécurisée…";
          });
          if (feedback) feedback.textContent = "Connexion à Stripe…";

          try {
            const rabbitName = document.getElementById("rabbitName")?.value.trim() || "";
            const cancelUrl = `${location.origin}${location.pathname}?checkout=cancelled#composer`;
            const response = await fetch(ENDPOINT, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ rabbitName, deliveryMode: st?.deliveryMode || "one_time", items, cancelUrl }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.url) throw new Error(data.error || `Erreur Stripe (${response.status})`);
            location.assign(data.url);
          } catch (error) {
            resetDirectCheckout();
            document.querySelectorAll("#orderCta, .v325-review-button, [data-v325-direct-checkout]").forEach((node) => {
              node.textContent = originalText;
            });
            const message = error?.message || "Impossible de créer le paiement.";
            if (feedback) feedback.textContent = message;
            alert(message);
          }
        }

        document.addEventListener("click", (event) => {
          const button = event.target.closest("#orderCta, .v325-review-button, [data-v325-direct-checkout]");
          if (!button) return;
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
          directBetaCheckout(button);
        }, true);

        window.addEventListener("pageshow", resetDirectCheckout);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") resetDirectCheckout();
        });
      })();
    </script>
    <script>
      (() => {
        const mobileMedia = window.matchMedia("(max-width: 767px)");

        const readCount = () => {
          try {
            if (typeof st !== "undefined" && Array.isArray(st.p)) {
              return st.p.reduce((sum, item) => sum + Number(item?.q || 0), 0);
            }
          } catch (_) {}
          return 0;
        };

        const syncMobileProgress = () => {
          if (!mobileMedia.matches) return;
          const mode = document.querySelector("#v325-composition-ui .v325-mode-switch");
          const validation = document.querySelector("#v325-composition-ui .v325-validation-copy");
          if (!mode || !validation) return;

          validation.style.setProperty("display", "none", "important");

          let block = mode.nextElementSibling;
          if (!block || !block.classList.contains("v329-mobile-progress")) {
            block = document.createElement("div");
            block.className = "v329-mobile-progress";
            block.innerHTML = `
              <div class="v329-mobile-progress-count" data-v329-mobile-count>0 sachet sélectionné</div>
              <div class="v329-mobile-progress-labels" aria-hidden="true">
                <span></span>
                <span><b>4 sachets</b><small>Livraison offerte</small></span>
                <span><b>8 sachets</b><small>Livraison offerte + 15 %</small></span>
              </div>
              <div class="v329-mobile-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0">
                <span data-v329-mobile-fill></span>
                <i class="v329-mobile-progress-dot v329-mobile-progress-dot-four"></i>
                <i class="v329-mobile-progress-dot v329-mobile-progress-dot-eight"></i>
              </div>
            `;
            mode.insertAdjacentElement("afterend", block);
          }

          const count = readCount();
          const countNode = block.querySelector("[data-v329-mobile-count]");
          const fill = block.querySelector("[data-v329-mobile-fill]");
          const track = block.querySelector(".v329-mobile-progress-track");
          if (countNode) countNode.textContent = `${count} sachet${count > 1 ? "s" : ""} sélectionné${count > 1 ? "s" : ""}`;
          if (fill) fill.style.width = `${Math.min(100, count / 8 * 100)}%`;
          if (track) track.setAttribute("aria-valuenow", String(Math.min(8, count)));
          block.classList.toggle("is-four", count >= 4);
          block.classList.toggle("is-eight", count >= 8);
        };

        const root = document.getElementById("v325-composition-ui");
        const observer = new MutationObserver(() => requestAnimationFrame(syncMobileProgress));
        if (root) observer.observe(root, { childList: true, subtree: true });

        document.addEventListener("DOMContentLoaded", syncMobileProgress);
        document.addEventListener("click", () => requestAnimationFrame(syncMobileProgress), true);
        window.addEventListener("pageshow", syncMobileProgress);
        mobileMedia.addEventListener?.("change", syncMobileProgress);
        setInterval(syncMobileProgress, 300);
      })();
    </script>
  </body>
</html>
