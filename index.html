    <script>
      (() => {
        const ENDPOINT = "https://lmw-checkout.vercel.app/api/create-checkout";
        let busy = false;

        function resetDirectCheckout() {
          busy = false;
          document.querySelectorAll("#orderCta, .v325-review-button, [data-v325-direct-checkout]").forEach((node) => {
            node.disabled = false;
            node.textContent = "Passer au paiement sécurisé";
          });
          const feedback = document.getElementById("checkoutFeedback");
          if (feedback?.textContent === "Connexion à Stripe…") feedback.textContent = "";
        }

        async function directCheckout(button) {
          if (busy) return;
          const items = (typeof products !== "undefined" && typeof st !== "undefined")
            ? products.map((product, index) => ({ id: product.id, quantity: Number(st.p?.[index]?.q || 0) })).filter((item) => item.quantity > 0)
            : [];
          const feedback = document.getElementById("checkoutFeedback");
          if (!items.length) {
            const message = "Ajoutez au moins un produit à votre box avant de passer au paiement.";
            if (feedback) feedback.textContent = message;
            alert(message);
            return;
          }

          busy = true;
          const originalText = button?.textContent || "Passer au paiement sécurisé";
          document.querySelectorAll("#orderCta, .v325-review-button, [data-v325-direct-checkout]").forEach((node) => {
            node.disabled = true;
            node.textContent = "Redirection sécurisée…";
          });
          if (feedback) feedback.textContent = "Connexion à Stripe…";

          try {
            const rabbitName = document.getElementById("rabbitName")?.value.trim() || "";
            const cancelUrl = `${location.origin}${location.pathname}?checkout=cancelled#composer`;
            const response = await fetch(ENDPOINT, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ rabbitName, deliveryMode: st?.deliveryMode || "one_time", items, cancelUrl }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.url) throw new Error(data.error || `Erreur Stripe (${response.status})`);
            location.assign(data.url);
          } catch (error) {
            resetDirectCheckout();
            document.querySelectorAll("#orderCta, .v325-review-button, [data-v325-direct-checkout]").forEach((node) => {
              node.textContent = originalText;
            });
            const message = error?.message || "Impossible de créer le paiement.";
            if (feedback) feedback.textContent = message;
            alert(message);
          }
        }

        document.addEventListener("click", (event) => {
          const button = event.target.closest("#orderCta, .v325-review-button, [data-v325-direct-checkout]");
          if (!button) return;
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
          directCheckout(button);
        }, true);

        window.addEventListener("pageshow", resetDirectCheckout);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") resetDirectCheckout();
        });
      })();
    </script>
    <script>
      (() => {
        const money = (value) => Number(value || 0).toLocaleString("fr-FR", { style: "currency", currency: "EUR" });

        const readTotals = () => {
          try {
            if (typeof products === "undefined" || typeof st === "undefined" || !Array.isArray(st.p)) return null;
            let count = 0;
            let gross = 0;
            products.forEach((product, index) => {
              const quantity = Number(st.p?.[index]?.q || 0);
              count += quantity;
              gross += quantity * Number(product.p || 0);
            });
            return { count, gross, discounted: count >= 8 ? gross * 0.85 : gross };
          } catch (_) {
            return null;
          }
        };

        const syncDiscount = () => {
          const totals = readTotals();
          if (!totals) return;
          const totalNodes = document.querySelectorAll("#composer .v325-total-line strong");
          totalNodes.forEach((node) => {
            if (totals.count >= 8) {
              node.classList.add("v330-discount-total");
              node.innerHTML = `<span class="v330-discount-old">${money(totals.gross)}</span><span class="v330-discount-new">${money(totals.discounted)}</span>`;
            } else {
              node.classList.remove("v330-discount-total");
              node.textContent = money(totals.gross);
            }
          });

          document.querySelectorAll("#composer .v325-total-summary").forEach((summary) => {
            let note = summary.querySelector(":scope > .v330-discount-note");
            if (totals.count >= 8) {
              if (!note) {
                note = document.createElement("p");
                note.className = "v330-discount-note";
                summary.appendChild(note);
              }
              note.innerHTML = `<span class="v330-discount-badge">Avantage 8 sachets débloqué</span> −15 % appliqués à votre sélection.`;
            } else if (note) {
              note.remove();
            }
          });
        };

        const schedule = () => requestAnimationFrame(syncDiscount);
        document.addEventListener("DOMContentLoaded", schedule);
        document.addEventListener("click", schedule, true);
        window.addEventListener("pageshow", schedule);
        setInterval(syncDiscount, 500);
      })();
    </script>
